<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Chamber Wish Wall</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f2eb;
  color: #292c29;
}


/* =====================================
   9:16 WALL
===================================== */

.wall {

  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background:

    radial-gradient(
      circle at 15% 12%,
      rgba(206,217,208,.60),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 80%,
      rgba(221,207,194,.35),
      transparent 27%
    ),

    #f6f3ed;
}


.wall::after {

  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  opacity: .13;

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(40,45,40,.035) 0,
      rgba(40,45,40,.035) 1px,
      transparent 1px,
      transparent 5px
    );

}


/* =====================================
   BRAND
===================================== */

.brand {

  position: absolute;

  top: 4.5%;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(15px, 2.1vw, 30px);

  letter-spacing: .32em;

  white-space: nowrap;
}


.brand-cn {

  display: block;

  margin-top: 9px;

  font-family:
    "PingFang TC",
    sans-serif;

  font-size: .5em;

  letter-spacing: .5em;

  color: #777d77;
}


/* =====================================
   CENTER MESSAGE
===================================== */

.hero {

  position: absolute;

  top: 41%;
  left: 50%;

  width: 82%;

  transform: translate(-50%, -50%);

  z-index: 2;

  text-align: center;

  pointer-events: none;
}


.eyebrow {

  margin-bottom: 25px;

  font-size: clamp(9px, 1.15vw, 15px);

  letter-spacing: .34em;

  color: #858b85;
}


.hero h1 {

  margin: 0;

  font-family:
    Georgia,
    "Noto Serif TC",
    "Songti TC",
    serif;

  font-size: clamp(34px, 6vw, 74px);

  line-height: 1.55;

  font-weight: 400;

  letter-spacing: .13em;
}


.hero p {

  margin: 24px auto 0;

  font-size: clamp(10px, 1.35vw, 17px);

  line-height: 1.8;

  letter-spacing: .12em;

  color: #7d837d;
}


/* =====================================
   WISH CARDS
===================================== */

#wishes {

  position: absolute;

  inset: 0;

  z-index: 5;

  pointer-events: none;
}


.wish-card {

  position: absolute;

  width: clamp(145px, 28vw, 260px);

  min-height: 100px;

  padding: clamp(16px, 2.3vw, 25px);

  border:

    1px solid
    rgba(70,75,70,.08);

  box-shadow:

    0 8px 35px
    rgba(40,45,40,.05);

  opacity: 0;

  animation:

    appear .65s ease forwards,

    float 7s ease-in-out
    infinite alternate;
}


.wish-text {

  font-family:
    Georgia,
    "Noto Serif TC",
    "Songti TC",
    serif;

  font-size: clamp(12px, 2vw, 20px);

  line-height: 1.75;

  letter-spacing: .04em;
}


.wish-user {

  margin-top: 12px;

  font-size: clamp(8px, 1.15vw, 12px);

  color:
    rgba(50,55,50,.55);
}


/* 顏色 */

.color-green {
  background:
    rgba(206,217,208,.78);
}

.color-rose {
  background:
    rgba(217,197,194,.74);
}

.color-peach {
  background:
    rgba(223,203,184,.74);
}

.color-mauve {
  background:
    rgba(201,193,202,.74);
}

.color-sand {
  background:
    rgba(216,208,190,.76);
}


/* =====================================
   NEW WISH SPOTLIGHT
===================================== */

#spotlight {

  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(35,39,35,.20);

  backdrop-filter:
    blur(3px);

  opacity: 0;

  visibility: hidden;

  transition:

    opacity .4s ease,

    visibility .4s;
}


#spotlight.active {

  opacity: 1;

  visibility: visible;
}


.spotlight-card {

  width: 78%;

  min-height: 28vh;

  padding:

    7vh
    8%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  background:
    rgba(248,246,240,.97);

  box-shadow:

    0 30px 90px
    rgba(20,25,20,.15);

  transform:
    scale(.96);

  opacity: 0;

  transition:

    transform .4s ease,

    opacity .4s ease;
}


#spotlight.active
.spotlight-card {

  transform:
    scale(1);

  opacity: 1;
}


.new-label {

  margin-bottom: 28px;

  font-size:
    clamp(10px, 1.5vw, 16px);

  letter-spacing:
    .25em;

  color:
    #758078;
}


.new-wish {

  max-width: 90%;

  font-family:
    Georgia,
    "Noto Serif TC",
    "Songti TC",
    serif;

  font-size:
    clamp(28px, 5vw, 58px);

  line-height: 1.65;

  letter-spacing: .05em;
}


.new-user {

  margin-top: 28px;

  font-size:
    clamp(11px, 1.5vw, 16px);

  color:
    #737973;
}


/* =====================================
   BOTTOM AREA
===================================== */

.bottom {

  position: absolute;

  bottom: 4%;

  left: 50%;

  transform:
    translateX(-50%);

  width: 82%;

  z-index: 15;

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-end;
}


.invite {

  max-width: 55%;

  font-size:
    clamp(10px, 1.3vw, 15px);

  line-height: 1.8;

  letter-spacing:
    .08em;

  color:
    #707770;
}


.invite strong {

  display: block;

  margin-bottom: 4px;

  font-family:
    Georgia,
    "Noto Serif TC",
    serif;

  font-size:
    1.25em;

  font-weight: 400;

  color:
    #343a35;
}


.status {

  font-size:
    clamp(7px, 1vw, 10px);

  letter-spacing:
    .14em;

  color:
    #9a9e99;
}


/* =====================================
   ANIMATION
===================================== */

@keyframes appear {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: .92;

    transform:
      translateY(0);

  }

}


@keyframes float {

  from {

    translate:
      0 0;

  }

  to {

    translate:
      0 -6px;

  }

}

</style>

</head>


<body>


<div class="wall">


  <div class="brand">

    RED CHAMBER

    <span class="brand-cn">
      朱 棧
    </span>

  </div>



  <div class="hero">

    <div class="eyebrow">

      RED CHAMBER WISH WALL

    </div>


    <h1>

      願你所念，<br>
      皆有回響。

    </h1>


    <p>

      把心願留在這裡，<br>
      讓它被世界輕輕接住

    </p>

  </div>



  <div id="wishes"></div>



  <div class="bottom">

    <div class="invite">

      <strong>
        你也有一個心願嗎？
      </strong>

      掃描 QR Code，
      寫下你的心願

    </div>


    <div
      class="status"
      id="status">

      CONNECTING…

    </div>

  </div>


</div>



<div id="spotlight">

  <div class="spotlight-card">


    <div class="new-label">

      ✦ 一個新的心願抵達

    </div>


    <div
      class="new-wish"
      id="newWish">
    </div>


    <div
      class="new-user"
      id="newUser">
    </div>


  </div>

</div>



<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://vwlrwbwkjdisqnuyhyjv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_eBt028R9cdusb-jR6Kd5jA_eY6HMlv2";


const db =
window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);


/* =====================================
   SETTINGS
===================================== */

/*
  新心願主要停留 2.5 秒
*/

const SPOTLIGHT_DURATION =
2500;


/*
  每則之間 0.4 秒
*/

const SPOTLIGHT_GAP =
400;


/*
  直式畫面不要塞太滿
*/

const MAX_VISIBLE_WISHES =
8;


let wishes = [];

let knownIds =
new Set();

let wishQueue = [];

let spotlightRunning =
false;


/* =====================================
   9:16 POSITIONS
===================================== */

const positions = [

  {
    left: 7,
    top: 14
  },

  {
    left: 58,
    top: 15
  },

  {
    left: 5,
    top: 27
  },

  {
    left: 61,
    top: 29
  },

  {
    left: 7,
    top: 54
  },

  {
    left: 60,
    top: 56
  },

  {
    left: 13,
    top: 70
  },

  {
    left: 56,
    top: 72
  }

];


/* =====================================
   INITIAL DATA
===================================== */

async function
loadInitialWishes() {

  const {
    data,
    error
  } =

  await db

    .from("wishes")

    .select("*")

    .eq(
      "is_visible",
      true
    )

    .order(
      "created_at",
      {
        ascending: true
      }
    )

    .limit(50);


  if (error) {

    console.error(error);

    document
      .getElementById("status")
      .textContent =
      "CONNECTION ERROR";

    return;

  }


  wishes =
    data || [];


  wishes.forEach(

    wish => {

      knownIds.add(
        wish.id
      );

    }

  );


  renderWall();


  updateStatus();

}


/* =====================================
   REALTIME
===================================== */

function
startRealtime() {


  db
  .channel(
    "red-chamber-wall"
  )


  .on(

    "postgres_changes",

    {

      event:
        "INSERT",

      schema:
        "public",

      table:
        "wishes"

    },


    payload => {


      const wish =
        payload.new;


      if (
        knownIds.has(
          wish.id
        )
      ) {

        return;

      }


      knownIds.add(
        wish.id
      );


      if (
        !wish.is_visible
      ) {

        return;

      }


      /*
        先加入背景
      */

      wishes.push(
        wish
      );


      renderWall();


      /*
        再進 Spotlight queue
      */

      wishQueue.push(
        wish
      );


      if (
        !spotlightRunning
      ) {

        playNextWish();

      }


      updateStatus();

    }

  )


  .subscribe(

    status => {


      console.log(
        "Realtime:",
        status
      );


      if (
        status ===
        "SUBSCRIBED"
      ) {

        updateStatus();

      }


      if (
        status ===
        "CHANNEL_ERROR"
        ||
        status ===
        "TIMED_OUT"
      ) {

        document
          .getElementById(
            "status"
          )
          .textContent =
          "RECONNECTING…";

      }

    }

  );

}


/* =====================================
   RENDER WALL
===================================== */

function
renderWall() {


  const container =

    document
    .getElementById(
      "wishes"
    );


  const visible =

    wishes
    .slice(
      -MAX_VISIBLE_WISHES
    );


  container.innerHTML =
    "";


  visible.forEach(

    (
      wish,
      index
    ) => {


      const card =

        document
        .createElement(
          "div"
        );


      card.className =

        "wish-card color-" +

        sanitizeColor(
          wish.color
        );


      const position =

        positions[
          index %
          positions.length
        ];


      card.style.left =

        position.left +
        "%";


      card.style.top =

        position.top +
        "%";


      const text =

        document
        .createElement(
          "div"
        );


      text.className =
        "wish-text";


      text.textContent =
        wish.wish;


      const user =

        document
        .createElement(
          "div"
        );


      user.className =
        "wish-user";


      user.textContent =
        wish.instagram;


      card.appendChild(
        text
      );


      card.appendChild(
        user
      );


      container.appendChild(
        card
      );

    }

  );

}


/* =====================================
   SPOTLIGHT
===================================== */

function
playNextWish() {


  if (
    wishQueue.length === 0
  ) {

    spotlightRunning =
      false;

    return;

  }


  spotlightRunning =
    true;


  const wish =

    wishQueue.shift();


  const spotlight =

    document
    .getElementById(
      "spotlight"
    );


  document
    .getElementById(
      "newWish"
    )
    .textContent =

    "「" +
    wish.wish +
    "」";


  document
    .getElementById(
      "newUser"
    )
    .textContent =

    wish.instagram;


  spotlight
    .classList
    .add(
      "active"
    );


  setTimeout(

    () => {


      spotlight
        .classList
        .remove(
          "active"
        );


      setTimeout(

        () => {

          playNextWish();

        },

        SPOTLIGHT_GAP

      );


    },

    SPOTLIGHT_DURATION

  );

}


/* =====================================
   STATUS
===================================== */

function
updateStatus() {

  document
    .getElementById(
      "status"
    )
    .textContent =

    wishes.length +
    " WISHES · LIVE";

}


/* =====================================
   COLOR
===================================== */

function
sanitizeColor(
  color
) {


  const allowed = [

    "green",

    "rose",

    "peach",

    "mauve",

    "sand"

  ];


  return

    allowed.includes(
      color
    )

    ? color

    : "green";

}


/* =====================================
   START
===================================== */

async function
init() {

  await
  loadInitialWishes();

  startRealtime();

}


init();

</script>


</body>
</html>
