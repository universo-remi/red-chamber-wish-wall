<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Chamber Wish Wall</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: #292c29;
  background: #f5f2eb;
}

.wall {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(206,217,208,.55), transparent 28%),
    radial-gradient(circle at 88% 82%, rgba(220,205,191,.35), transparent 28%),
    #f5f2eb;
}

.wall::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(40,45,40,.035) 0,
      rgba(40,45,40,.035) 1px,
      transparent 1px,
      transparent 5px
    );
}

.brand {
  position: absolute;
  top: 5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: .32em;
  font-size: clamp(15px, 1.25vw, 25px);
  white-space: nowrap;
}

.brand-cn {
  display: block;
  margin-top: 8px;
  font-family: "PingFang TC", sans-serif;
  font-size: .55em;
  letter-spacing: .5em;
  color: #747a74;
}

.hero {
  position: absolute;
  top: 43%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  text-align: center;
  pointer-events: none;
}

.eyebrow {
  margin-bottom: 20px;
  font-size: clamp(9px, .75vw, 14px);
  letter-spacing: .35em;
  color: #818781;
}

.hero h1 {
  margin: 0;
  font-family: Georgia, "Noto Serif TC", "Songti TC", serif;
  font-size: clamp(30px, 3.2vw, 65px);
  font-weight: 400;
  letter-spacing: .12em;
  white-space: nowrap;
}

.hero p {
  margin-top: 22px;
  font-size: clamp(10px, .85vw, 16px);
  letter-spacing: .15em;
  color: #7a807a;
}

/* ===== 背景心願 ===== */

#wishes {
  position: absolute;
  inset: 0;
  z-index: 3;
}

.wish-card {
  position: absolute;
  width: clamp(170px, 15vw, 300px);
  min-height: 95px;
  padding: clamp(16px, 1.3vw, 25px);
  border: 1px solid rgba(70,75,70,.08);
  box-shadow: 0 8px 35px rgba(40,45,40,.055);
  opacity: 0;
  animation:
    cardAppear .7s ease forwards,
    float 8s ease-in-out infinite alternate;
}

.wish-text {
  font-family: Georgia, "Noto Serif TC", "Songti TC", serif;
  font-size: clamp(13px, 1vw, 19px);
  line-height: 1.8;
  letter-spacing: .04em;
}

.wish-user {
  margin-top: 14px;
  font-size: clamp(8px, .65vw, 12px);
  letter-spacing: .08em;
  color: rgba(50,55,50,.58);
}

.color-green { background: rgba(206,217,208,.76); }
.color-rose  { background: rgba(217,197,194,.72); }
.color-peach { background: rgba(223,203,184,.70); }
.color-mauve { background: rgba(201,193,202,.72); }
.color-sand  { background: rgba(216,208,190,.72); }

/* ===== 新心願 ===== */

#spotlight {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(34,38,34,.22);
  backdrop-filter: blur(3px);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .5s ease,
    visibility .5s;
}

#spotlight.active {
  opacity: 1;
  visibility: visible;
}

.spotlight-card {
  width: min(58vw, 820px);
  min-height: 300px;
  padding: 50px 70px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  background: rgba(248,246,240,.97);
  box-shadow: 0 35px 90px rgba(20,25,20,.16);

  transform: scale(.95);
  opacity: 0;

  transition:
    transform .5s ease,
    opacity .5s ease;
}

#spotlight.active .spotlight-card {
  transform: scale(1);
  opacity: 1;
}

.new-label {
  margin-bottom: 26px;
  font-size: clamp(10px, .8vw, 15px);
  letter-spacing: .28em;
  color: #758078;
}

.new-wish {
  max-width: 680px;
  font-family: Georgia, "Noto Serif TC", "Songti TC", serif;
  font-size: clamp(26px, 2.5vw, 50px);
  line-height: 1.65;
  letter-spacing: .05em;
}

.new-user {
  margin-top: 24px;
  font-size: clamp(11px, .85vw, 16px);
  letter-spacing: .08em;
  color: #737973;
}

.status {
  position: absolute;
  bottom: 3vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;

  font-size: clamp(8px, .6vw, 11px);
  letter-spacing: .12em;
  color: #979b96;
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: .9;
    transform: translateY(0);
  }
}

@keyframes float {
  from { translate: 0 0; }
  to { translate: 0 -6px; }
}

@media (max-width: 800px) {
  .hero h1 {
    white-space: normal;
  }

  .spotlight-card {
    width: 84vw;
    min-height: 250px;
    padding: 38px 26px;
  }
}
</style>
</head>

<body>

<div class="wall">

  <div class="brand">
    RED CHAMBER
    <span class="brand-cn">朱棧</span>
  </div>

  <div class="hero">

    <div class="eyebrow">
      RED CHAMBER WISH WALL
    </div>

    <h1>願你所念，皆有回響。</h1>

    <p>
      把心願留在這裡，讓它被世界輕輕接住
    </p>

  </div>

  <div id="wishes"></div>

  <div class="status" id="status">
    CONNECTING…
  </div>

</div>


<div id="spotlight">

  <div class="spotlight-card">

    <div class="new-label">
      ✦ 一個新的心願抵達
    </div>

    <div class="new-wish" id="newWish"></div>

    <div class="new-user" id="newUser"></div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://vwlrwbwkjdisqnuyhyjv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eBt028R9cdusb-jR6Kd5jA_eY6HMlv2";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   設定
============================== */

const SPOTLIGHT_DURATION = 3000;
const SPOTLIGHT_GAP = 500;
const MAX_VISIBLE_WISHES = 12;

let wishes = [];
let knownIds = new Set();

let wishQueue = [];
let spotlightRunning = false;


/* ==============================
   心願位置
============================== */

const positions = [

  { left: 5,  top: 18 },
  { left: 24, top: 15 },
  { left: 69, top: 17 },
  { left: 82, top: 29 },

  { left: 4,  top: 48 },
  { left: 79, top: 51 },

  { left: 9,  top: 70 },
  { left: 28, top: 75 },
  { left: 61, top: 73 },
  { left: 81, top: 72 },

  { left: 19, top: 32 },
  { left: 67, top: 35 }

];


/* ==============================
   初始載入
============================== */

async function loadInitialWishes() {

  const { data, error } = await db
    .from("wishes")
    .select("*")
    .eq("is_visible", true)
    .order("created_at", {
      ascending: true
    })
    .limit(50);

  if (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "CONNECTION ERROR";

    return;
  }

  wishes = data || [];

  wishes.forEach(wish => {
    knownIds.add(wish.id);
  });

  renderWall();

  document.getElementById("status").textContent =
    wishes.length + " WISHES · LIVE";
}


/* ==============================
   REALTIME
============================== */

function startRealtime() {

  db.channel("red-chamber-wish-wall")

    .on(
      "postgres_changes",

      {
        event: "INSERT",
        schema: "public",
        table: "wishes"
      },

      payload => {

        const wish = payload.new;

        /*
          避免重複
        */

        if (knownIds.has(wish.id)) {
          return;
        }

        knownIds.add(wish.id);


        /*
          如果被設定成不公開，
          不進牆。
        */

        if (!wish.is_visible) {
          return;
        }


        /*
          馬上加入背景牆
        */

        wishes.push(wish);

        renderWall();


        /*
          加入 Spotlight 排隊
        */

        wishQueue.push(wish);


        if (!spotlightRunning) {
          playNextWish();
        }


        document.getElementById("status").textContent =
          wishes.length + " WISHES · LIVE";

      }
    )

    .subscribe(status => {

      console.log(
        "Realtime status:",
        status
      );

      if (status === "SUBSCRIBED") {

        document.getElementById("status").textContent =
          wishes.length + " WISHES · LIVE";

      }

      else if (
        status === "CHANNEL_ERROR" ||
        status === "TIMED_OUT"
      ) {

        document.getElementById("status").textContent =
          "RECONNECTING…";

      }

    });

}


/* ==============================
   畫背景心願
============================== */

function renderWall() {

  const container =
    document.getElementById("wishes");

  const visible =
    wishes.slice(-MAX_VISIBLE_WISHES);

  container.innerHTML = "";


  visible.forEach((wish, index) => {

    const card =
      document.createElement("div");

    const color =
      sanitizeColor(wish.color);

    card.className =
      "wish-card color-" + color;


    const position =
      positions[index % positions.length];

    card.style.left =
      position.left + "%";

    card.style.top =
      position.top + "%";


    const text =
      document.createElement("div");

    text.className =
      "wish-text";

    text.textContent =
      wish.wish;


    const user =
      document.createElement("div");

    user.className =
      "wish-user";

    user.textContent =
      wish.instagram;


    card.appendChild(text);
    card.appendChild(user);

    container.appendChild(card);

  });

}


/* ==============================
   Spotlight Queue
============================== */

function playNextWish() {

  if (wishQueue.length === 0) {

    spotlightRunning = false;

    return;
  }

  spotlightRunning = true;


  const wish =
    wishQueue.shift();


  const spotlight =
    document.getElementById("spotlight");

  document.getElementById("newWish").textContent =
    "「" + wish.wish + "」";

  document.getElementById("newUser").textContent =
    wish.instagram;


  spotlight.classList.add("active");


  /*
    顯示 3 秒
  */

  setTimeout(() => {

    spotlight.classList.remove("active");


    /*
      0.5 秒後接下一個
    */

    setTimeout(() => {

      playNextWish();

    }, SPOTLIGHT_GAP);


  }, SPOTLIGHT_DURATION);

}


/* ==============================
   顏色安全檢查
============================== */

function sanitizeColor(color) {

  const allowed = [
    "green",
    "rose",
    "peach",
    "mauve",
    "sand"
  ];

  return allowed.includes(color)
    ? color
    : "green";
}


/* ==============================
   啟動
============================== */

async function init() {

  await loadInitialWishes();

  startRealtime();

}

init();

</script>

</body>
</html>
