<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Red Chamber Wish Wall</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #202320;

      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }


    /* =========================================
       9:16 SCREEN
       ========================================= */

    #screen {
      position: relative;

      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));

      aspect-ratio: 9 / 16;

      overflow: hidden;

      color: #292d29;

      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(206, 217, 208, .72),
          transparent 25%
        ),

        radial-gradient(
          circle at 88% 67%,
          rgba(223, 210, 196, .35),
          transparent 28%
        ),

        #f6f3ed;

      box-shadow:
        0 0 60px rgba(0, 0, 0, .18);
    }


    #screen::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 200;

      pointer-events: none;

      opacity: .10;

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(40, 45, 40, .04) 0,
          rgba(40, 45, 40, .04) 1px,
          transparent 1px,
          transparent 5px
        );
    }


    /* =========================================
       BRAND
       ========================================= */

    .brand {
      position: absolute;

      top: 4.2%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 30;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(12px, 2vh, 24px);

      letter-spacing:
        .32em;

      white-space:
        nowrap;
    }


    .brand-cn {
      display: block;

      margin-top:
        .8vh;

      font-family:
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      font-size:
        .48em;

      letter-spacing:
        .5em;

      color:
        #747b75;
    }


    /* =========================================
       WISH AREA
       只允許心意出現在這個區域
       ========================================= */

    #wishArea {
      position: absolute;

      top: 10%;
      left: 0;

      width: 100%;
      height: 67%;

      z-index: 5;

      overflow: hidden;

      pointer-events: none;
    }


    #wishes {
      position: absolute;
      inset: 0;
    }


    /* =========================================
       WISH CARDS
       ========================================= */

    .wish-card {
      position: absolute;

      width: 29%;

      min-height: 10%;

      padding:
        2.2%
        2.5%;

      border:
        1px solid
        rgba(60, 65, 60, .07);

      box-shadow:
        0 8px 28px
        rgba(40, 45, 40, .055);

      opacity: 0;

      animation:
        wishAppear .55s ease forwards,
        wishFloat 7s ease-in-out infinite alternate;
    }


    .wish-text {
      font-family:
        Georgia,
        "Noto Serif TC",
        "Songti TC",
        serif;

      font-size:
        clamp(9px, 1.6vh, 18px);

      line-height:
        1.7;

      letter-spacing:
        .025em;

      overflow-wrap:
        anywhere;
    }


    .wish-user {
      margin-top:
        1vh;

      font-size:
        clamp(6px, .9vh, 10px);

      letter-spacing:
        .05em;

      color:
        rgba(45, 50, 45, .55);

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }


    /* =========================================
       五種心意色
       與投稿頁 color 值連動
       ========================================= */

    .color-green {
      background:
        rgba(206, 217, 208, .93);
    }

    .color-rose {
      background:
        rgba(217, 197, 194, .92);
    }

    .color-peach {
      background:
        rgba(223, 203, 184, .92);
    }

    .color-mauve {
      background:
        rgba(201, 193, 202, .92);
    }

    .color-sand {
      background:
        rgba(216, 208, 190, .93);
    }


    /* =========================================
       BOTTOM BRAND MESSAGE
       ========================================= */

    .bottom-content {
      position: absolute;

      left: 8%;
      right: 8%;
      bottom: 3.8%;

      z-index: 30;
    }


    .main-message {
      width: 100%;

      margin-bottom:
        3.2vh;

      text-align:
        center;

      font-family:
        Georgia,
        "Noto Serif TC",
        "Songti TC",
        serif;

      font-size:
        clamp(17px, 2.8vh, 31px);

      font-weight:
        400;

      letter-spacing:
        .09em;

      white-space:
        nowrap;

      color:
        #303530;
    }


    /* =========================================
       CTA / QR AREA
       ========================================= */

    .cta-area {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding-top:
        2vh;

      border-top:
        1px solid
        rgba(60, 65, 60, .10);
    }


    .cta-copy {
      width: 60%;

      color:
        #6f766f;

      font-size:
        clamp(7px, 1.05vh, 12px);

      line-height:
        1.8;

      letter-spacing:
        .06em;
    }


    .cta-title {
      display: block;

      margin-bottom:
        .35vh;

      font-family:
        Georgia,
        "Noto Serif TC",
        serif;

      font-size:
        1.32em;

      font-weight:
        400;

      color:
        #343934;
    }


    /* 目前先保留 QR 位置 */

    .qr-placeholder {
      width:
        clamp(48px, 7.2vh, 82px);

      aspect-ratio:
        1 / 1;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid
        rgba(55, 60, 55, .18);

      background:
        rgba(255, 255, 255, .55);

      color:
        #858b85;

      font-size:
        clamp(5px, .7vh, 8px);

      letter-spacing:
        .08em;

      text-align:
        center;
    }


    .status {
      position: absolute;

      right: 0;
      bottom: -2.1vh;

      font-size:
        clamp(5px, .68vh, 8px);

      letter-spacing:
        .12em;

      color:
        #a0a49f;
    }


    /* =========================================
       SPOTLIGHT
       ========================================= */

    #spotlight {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(36, 40, 36, .21);

      backdrop-filter:
        blur(3px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .4s ease,
        visibility .4s ease;
    }


    #spotlight.active {
      opacity: 1;
      visibility: visible;
    }


    .spotlight-card {
      width: 78%;

      min-height: 25%;

      padding:
        5.5vh
        8%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      border:
        1px solid
        rgba(60, 65, 60, .07);

      box-shadow:
        0 30px 75px
        rgba(20, 25, 20, .16);

      transform:
        scale(.96);

      opacity: 0;

      transition:
        transform .4s ease,
        opacity .4s ease,
        background .35s ease;
    }


    #spotlight.active
    .spotlight-card {
      transform:
        scale(1);

      opacity: 1;
    }


    .new-label {
      margin-bottom:
        2.3vh;

      font-size:
        clamp(7px, 1.1vh, 13px);

      letter-spacing:
        .23em;

      color:
        #68746b;
    }


    .new-wish {
      width: 100%;

      font-family:
        Georgia,
        "Noto Serif TC",
        "Songti TC",
        serif;

      font-size:
        clamp(21px, 4vh, 45px);

      line-height:
        1.6;

      letter-spacing:
        .04em;

      overflow-wrap:
        anywhere;
    }


    .new-user {
      margin-top:
        2.2vh;

      font-size:
        clamp(8px, 1.1vh, 13px);

      letter-spacing:
        .06em;

      color:
        #676e68;
    }


    /* =========================================
       ANIMATION
       ========================================= */

    @keyframes wishAppear {

      from {
        opacity: 0;

        transform:
          translateY(8px);
      }

      to {
        opacity: .94;

        transform:
          translateY(0);
      }

    }


    @keyframes wishFloat {

      from {
        translate:
          0 0;
      }

      to {
        translate:
          0 -5px;
      }

    }

  </style>

</head>


<body>


  <main id="screen">


    <!-- BRAND -->

    <header class="brand">

      RED CHAMBER

      <span class="brand-cn">
        朱 棧
      </span>

    </header>



    <!-- WISHES -->

    <section id="wishArea">

      <div id="wishes"></div>

    </section>



    <!-- BOTTOM -->

    <section class="bottom-content">


      <div class="main-message">

        願你所念，皆有回響。

      </div>


      <div class="cta-area">


        <div class="cta-copy">

          <span class="cta-title">

            你也有還未說出口的心意嗎？

          </span>

          掃描 QR Code，開始撰寫吧！

        </div>


        <div class="qr-placeholder">

          QR<br>CODE

        </div>


      </div>


      <div
        class="status"
        id="status">

        CONNECTING…

      </div>


    </section>



    <!-- NEW WISH SPOTLIGHT -->

    <div id="spotlight">


      <div
        class="spotlight-card"
        id="spotlightCard">


        <div class="new-label">

          ✦ 一份新的心意抵達

        </div>


        <div
          class="new-wish"
          id="newWish">
        </div>


        <div
          class="new-user"
          id="newUser">
        </div>


      </div>


    </div>


  </main>



  <script>

    /* =========================================
       SUPABASE
       ========================================= */

    const SUPABASE_URL =
      "https://vwlrwbwkjdisqnuyhyjv.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_eBt028R9cdusb-jR6Kd5jA_eY6HMlv2";


    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       SETTINGS
       ========================================= */

    const SPOTLIGHT_DURATION =
      2500;


    const SPOTLIGHT_GAP =
      400;


    const MAX_VISIBLE_WISHES =
      8;



    let wishes = [];


    let knownIds =
      new Set();


    let wishQueue =
      [];


    let spotlightRunning =
      false;



    /* =========================================
       心意位置
       座標只會存在 Wish Area 裡
       不可能碰到底部文案
       ========================================= */

    const positions = [

      {
        left: 7,
        top: 5
      },

      {
        left: 63,
        top: 8
      },

      {
        left: 35,
        top: 23
      },

      {
        left: 5,
        top: 37
      },

      {
        left: 65,
        top: 39
      },

      {
        left: 30,
        top: 54
      },

      {
        left: 8,
        top: 70
      },

      {
        left: 61,
        top: 72
      }

    ];



    /* =========================================
       COLORS
       ========================================= */

    function sanitizeColor(color) {

      const allowed = [
        "green",
        "rose",
        "peach",
        "mauve",
        "sand"
      ];


      return allowed.includes(color)
        ? color
        : "green";

    }



    function getColorValue(color) {

      const colors = {

        green:
          "rgba(206, 217, 208, .97)",

        rose:
          "rgba(217, 197, 194, .97)",

        peach:
          "rgba(223, 203, 184, .97)",

        mauve:
          "rgba(201, 193, 202, .97)",

        sand:
          "rgba(216, 208, 190, .97)"

      };


      return colors[
        sanitizeColor(color)
      ];

    }



    /* =========================================
       INITIAL LOAD
       ========================================= */

    async function loadInitialWishes() {

      const {
        data,
        error
      } =

        await db

          .from("wishes")

          .select("*")

          .eq(
            "is_visible",
            true
          )

          .order(
            "created_at",
            {
              ascending: true
            }
          )

          .limit(50);



      if (error) {

        console.error(
          "Initial load error:",
          error
        );


        document
          .getElementById(
            "status"
          )
          .textContent =
          "CONNECTION ERROR";


        return;

      }



      wishes =
        data || [];



      wishes.forEach(

        wish => {

          knownIds.add(
            wish.id
          );

        }

      );



      renderWall();

      updateStatus();

    }



    /* =========================================
       REALTIME
       ========================================= */

    function startRealtime() {


      db

        .channel(
          "red-chamber-wish-wall"
        )


        .on(

          "postgres_changes",

          {

            event:
              "INSERT",

            schema:
              "public",

            table:
              "wishes"

          },


          payload => {


            const wish =
              payload.new;



            if (
              knownIds.has(
                wish.id
              )
            ) {

              return;

            }



            knownIds.add(
              wish.id
            );



            if (
              wish.is_visible !== true
            ) {

              return;

            }



            wishes.push(
              wish
            );



            renderWall();

            updateStatus();



            wishQueue.push(
              wish
            );



            if (
              !spotlightRunning
            ) {

              playNextWish();

            }

          }

        )


        .subscribe(

          status => {


            console.log(
              "Realtime status:",
              status
            );



            if (
              status ===
              "SUBSCRIBED"
            ) {

              updateStatus();

            }



            if (
              status ===
              "CHANNEL_ERROR"
              ||
              status ===
              "TIMED_OUT"
              ||
              status ===
              "CLOSED"
            ) {

              document
                .getElementById(
                  "status"
                )
                .textContent =
                "RECONNECTING…";

            }

          }

        );

    }



    /* =========================================
       RENDER WALL
       ========================================= */

    function renderWall() {


      const container =
        document.getElementById(
          "wishes"
        );



      const visibleWishes =
        wishes.slice(
          -MAX_VISIBLE_WISHES
        );



      container.innerHTML =
        "";



      visibleWishes.forEach(

        (wish, index) => {


          const card =
            document.createElement(
              "article"
            );



          const safeColor =
            sanitizeColor(
              wish.color
            );



          card.className =

            "wish-card color-" +
            safeColor;



          const position =

            positions[
              index %
              positions.length
            ];



          card.style.left =

            position.left +
            "%";



          card.style.top =

            position.top +
            "%";



          /*
            輕微大小差異
          */

          const variations = [

            .92,
            .98,
            .90,
            1,
            .94,
            .98,
            .91,
            .96

          ];



          card.style.scale =

            variations[index];



          const text =

            document.createElement(
              "div"
            );



          text.className =
            "wish-text";



          text.textContent =
            wish.wish;



          const user =

            document.createElement(
              "div"
            );



          user.className =
            "wish-user";



          user.textContent =
            wish.instagram;



          card.appendChild(
            text
          );



          card.appendChild(
            user
          );



          container.appendChild(
            card
          );

        }

      );

    }



    /* =========================================
       SPOTLIGHT
       ========================================= */

    function playNextWish() {


      if (
        wishQueue.length === 0
      ) {

        spotlightRunning =
          false;

        return;

      }



      spotlightRunning =
        true;



      const wish =
        wishQueue.shift();



      const spotlight =
        document.getElementById(
          "spotlight"
        );



      const spotlightCard =
        document.getElementById(
          "spotlightCard"
        );



      /*
        Spotlight 同步投稿顏色
      */

      spotlightCard.style.background =

        getColorValue(
          wish.color
        );



      document
        .getElementById(
          "newWish"
        )
        .textContent =

        "「" +
        wish.wish +
        "」";



      document
        .getElementById(
          "newUser"
        )
        .textContent =

        wish.instagram;



      spotlight
        .classList
        .add(
          "active"
        );



      setTimeout(

        () => {


          spotlight
            .classList
            .remove(
              "active"
            );



          setTimeout(

            () => {

              playNextWish();

            },

            SPOTLIGHT_GAP

          );


        },

        SPOTLIGHT_DURATION

      );

    }



    /* =========================================
       STATUS
       ========================================= */

    function updateStatus() {


      document
        .getElementById(
          "status"
        )
        .textContent =

        wishes.length +
        " WISHES · LIVE";

    }



    /* =========================================
       START
       ========================================= */

    async function init() {


      await loadInitialWishes();


      startRealtime();

    }


    init();

  </script>


</body>

</html>
